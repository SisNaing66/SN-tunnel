name: Build Android APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Validate or Generate Gradle Wrapper
        run: |
          if [ ! -f "./gradlew" ]; then
            echo "gradlew not found. Generating Gradle wrapper..."
            gradle wrapper --gradle-version 8.5
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission for Gradle Wrapper
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Prepare APK Files with Architecture Names
        run: |
          mkdir -p output_apks
          cp app/build/outputs/apk/debug/app-debug.apk output_apks/WARP-TUNNEL-Universal-arm64-v8a-armeabi-v7a-x86_64-debug.apk

      - name: Create Nightly Release / Upload APK Direct
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: "v1.0.0-debug"
          name: "WARP TUNNEL Debug Build (arm64-v8a / armeabi-v7a / x86_64)"
          body: |
            ### 🚀 WARP TUNNEL Debug APK
            - **Supported Architectures:** `arm64-v8a`, `armeabi-v7a`, `x86_64`
            - **Engine:** Xray-core (`libv2ray`)
            - Direct `.apk` Download
          draft: false
          prerelease: true
          files: output_apks/*.apk
