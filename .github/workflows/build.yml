name: Build Android APKs

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Validate or Generate Gradle Wrapper
        run: |
          if [ ! -f "./gradlew" ]; then
            echo "gradlew not found. Generating Gradle wrapper..."
            gradle wrapper --gradle-version 8.5
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission for Gradle Wrapper
        run: chmod +x ./gradlew

      - name: Build APKs
        run: ./gradlew assembleDebug --no-daemon

      # ----------------------------------------------------
      # 1. Rename APKs to WarpTunnel format
      # ----------------------------------------------------
      - name: Rename APKs to WarpTunnel Format
        run: |
          cd app/build/outputs/apk/debug/
          
          # Rename each APK
          for file in *.apk; do
            if [[ "$file" == *"arm64-v8a"* ]]; then
              mv "$file" "WarpTunnel-arm64-v8a.apk"
            elif [[ "$file" == *"armeabi-v7a"* ]]; then
              mv "$file" "WarpTunnel-armeabi-v7a.apk"
            elif [[ "$file" == *"x86_64"* ]] || [[ "$file" == *"x86-64"* ]]; then
              mv "$file" "WarpTunnel-x86_64.apk"
            elif [[ "$file" == *"universal"* ]]; then
              mv "$file" "WarpTunnel-universal.apk"
            elif [[ "$file" == *"x86"* ]] && [[ ! "$file" == *"x86_64"* ]]; then
              mv "$file" "WarpTunnel-x86.apk"
            else
              # Default rename
              mv "$file" "WarpTunnel-${file}"
            fi
          done
          
          # List renamed files
          ls -la

      # ----------------------------------------------------
      # 2. Delete original app-*.apk files
      # ----------------------------------------------------
      - name: Remove Original APK Files
        run: |
          cd app/build/outputs/apk/debug/
          # Delete any app-*.apk files
          rm -f app-*.apk
          # Keep only WarpTunnel-*.apk
          echo "Remaining APK files:"
          ls -la WarpTunnel-*.apk

      # ----------------------------------------------------
      # 3. Upload Artifacts
      # ----------------------------------------------------
      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: WarpTunnel-APKs
          path: app/build/outputs/apk/debug/WarpTunnel-*.apk
          retention-days: 30

      # ----------------------------------------------------
      # 4. Upload Individual Split APKs as Separate Artifacts
      # ----------------------------------------------------
      - name: Upload arm64-v8a APK
        uses: actions/upload-artifact@v4
        with:
          name: WarpTunnel-arm64-v8a
          path: app/build/outputs/apk/debug/WarpTunnel-arm64-v8a.apk
          retention-days: 30

      - name: Upload armeabi-v7a APK
        uses: actions/upload-artifact@v4
        with:
          name: WarpTunnel-armeabi-v7a
          path: app/build/outputs/apk/debug/WarpTunnel-armeabi-v7a.apk
          retention-days: 30

      - name: Upload x86_64 APK
        uses: actions/upload-artifact@v4
        with:
          name: WarpTunnel-x86_64
          path: app/build/outputs/apk/debug/WarpTunnel-x86_64.apk
          retention-days: 30

      - name: Upload x86 APK
        uses: actions/upload-artifact@v4
        with:
          name: WarpTunnel-x86
          path: app/build/outputs/apk/debug/WarpTunnel-x86.apk
          retention-days: 30

      - name: Upload Universal APK
        uses: actions/upload-artifact@v4
        with:
          name: WarpTunnel-universal
          path: app/build/outputs/apk/debug/WarpTunnel-universal.apk
          retention-days: 30

      # ----------------------------------------------------
      # 5. Upload to GitHub Releases
      # ----------------------------------------------------
      - name: Upload WarpTunnel APKs to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: "v1.0.0"
          name: "v1.0.0"
          body: |
            ### 🔥 WARP TUNNEL Android APK Builds
            
            | Architecture | Download | Size |
            | --- | --- | --- |
            | **ARM64-v8a** (64-bit) | [WarpTunnel-arm64-v8a.apk]() | ~9.18 MB |
            | **ARMv7-a** (32-bit) | [WarpTunnel-armeabi-v7a.apk]() | ~8.64 MB |
            | **x86_64** (64-bit) | [WarpTunnel-x86_64.apk]() | ~9.32 MB |
            | **x86** (32-bit) | [WarpTunnel-x86.apk]() | ~8.65 MB |
            | **Universal** (All) | [WarpTunnel-universal.apk]() | ~17.2 MB |
            
            ---
            
            ### 📱 Installation Instructions
            1. Download the APK for your device architecture
            2. Enable "Install from Unknown Sources" in Settings
            3. Install and enjoy! 🚀
            
            ---
            
            ### ⚡ Features
            - ✅ WireGuard-based WARP VPN
            - ✅ Auto-config from Cloudflare API
            - ✅ Custom DNS support (Cloudflare/Google)
            - ✅ Dark Mode support
            - ✅ Auto-ping monitoring
            - ✅ Multiple server config support
            
            ---
            
            ### 📝 Changelog
            - Initial release
            - Fixed config parsing issues
            - Added fallback API support
            - Optimized APK sizes
          draft: false
          prerelease: false
          files: app/build/outputs/apk/debug/WarpTunnel-*.apk

      # ----------------------------------------------------
      # 6. GitHub Actions Summary (Artifacts List)
      # ----------------------------------------------------
      - name: Generate APK Summary
        run: |
          echo "### 📦 WARP TUNNEL - Built APK Files" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Architecture | File Name | Size | SHA256 |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- | --- | --- |" >> $GITHUB_STEP_SUMMARY
          
          cd app/build/outputs/apk/debug/
          
          for file in WarpTunnel-*.apk; do
            if [ -f "$file" ]; then
              filename=$(basename "$file")
              filesize=$(du -h "$file" | cut -f1)
              sha256=$(sha256sum "$file" | cut -d' ' -f1 | cut -c1-16)
              
              # Extract architecture from filename
              if [[ "$file" == *"arm64-v8a"* ]]; then
                arch="🟢 ARM64-v8a"
              elif [[ "$file" == *"armeabi-v7a"* ]]; then
                arch="🟡 ARMv7-a"
              elif [[ "$file" == *"x86_64"* ]]; then
                arch="🔵 x86_64"
              elif [[ "$file" == *"universal"* ]]; then
                arch="🟣 Universal"
              elif [[ "$file" == *"x86"* ]]; then
                arch="🟠 x86"
              else
                arch="⚪ Other"
              fi
              
              echo "| $arch | \`$filename\` | $filesize | \`$sha256...\` |" >> $GITHUB_STEP_SUMMARY
            fi
          done
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📥 Download Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "All APKs are available as downloadable artifacts in this workflow run." >> $GITHUB_STEP_SUMMARY

      # ----------------------------------------------------
      # 7. Build Time and Status
      # ----------------------------------------------------
      - name: Build Completion Status
        run: |
          echo "### ✅ Build Completed Successfully!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Build Time:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "**APK Count:** $(ls -1 app/build/outputs/apk/debug/WarpTunnel-*.apk 2>/dev/null | wc -l)" >> $GITHUB_STEP_SUMMARY
          echo "**Total Size:** $(du -sh app/build/outputs/apk/debug/ | cut -f1)" >> $GITHUB_STEP_SUMMARY
