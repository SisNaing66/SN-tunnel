name: Build Android APKs

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Validate or Generate Gradle Wrapper
        run: |
          if [ ! -f "./gradlew" ]; then
            echo "gradlew not found. Generating Gradle wrapper..."
            gradle wrapper --gradle-version 8.5
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission for Gradle Wrapper
        run: chmod +x ./gradlew

      - name: Build APKs
        run: ./gradlew assembleDebug --no-daemon

      # ----------------------------------------------------
      # 1. GitHub Releases
      # ----------------------------------------------------
      - name: Upload All Split APKs to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: "v1.0.0"
          name: "WARP TUNNEL Builds"
          body: |
            ### 🚀 WARP TUNNEL Split APK Builds
            - **arm64-v8a**: `app-arm64-v8a.apk`
            - **armeabi-v7a**: `app-armeabi-v7a.apk`
            - **x86_64**: `app-x86_64.apk`
            - **Universal**: `app-universal.apk`
          draft: false
          prerelease: false
          files: app/build/outputs/apk/debug/*.apk

      # ----------------------------------------------------
      # 2. GitHub Actions Summary
      # ----------------------------------------------------
      - name: Print Built APK List
        run: |
          echo "### 📦 Generated APK Files" >> $GITHUB_STEP_SUMMARY
          echo "| File Name | Size |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
          for file in app/build/outputs/apk/debug/*.apk; do
            filename=$(basename "$file")
            filesize=$(du -h "$file" | cut -f1)
            echo "| \`$filename\` | $filesize |" >> $GITHUB_STEP_SUMMARY
          done
